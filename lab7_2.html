<!DOCTYPE html>
<head>
    <title>Практична робота 7.2</title>
</head>
<body>

    <h1>Робота з JavaScript функціями</h1>
    <p>Результати виконання можна переглянути у консолі розробника (F12 - Console).</p>

    <script>
        function factorialRecursion(n) {
            if (n === 0 || n === 1) {
                return 1;
            }
            return n * factorialRecursion(n - 1);
        }
        console.log(factorialRecursion(5)); // 120 (оскільки 5 * 4 * 3 * 2 * 1 = 120)
        console.log(factorialRecursion(4)); // 24  (оскільки 4 * 3 * 2 * 1 = 24)
        console.log(factorialRecursion(0)); // 1
    </script>
</body>
</html>
