<!DOCTYPE html>
<head>
    <title>Практична робота 7</title>
</head>
<body>

    <h1>Робота з JavaScript функціями</h1>
    <p>Результати виконання можна переглянути у консолі розробника (F12 - Console).</p>

    <script>
        function sumOrMinus(...args) {
            if (args.length === 0) return 0;

            if (args.length % 2 === 0) {
                return args.reduce((acc, val) => acc + val, 0);
            } else {
                return args.slice().reverse().reduce((acc, val, index) => {
                    return index === 0 ? val : acc - val;
                });
            }
        }

        // Тести
        console.log(sumOrMinus(1, 2, 3));       // 0
        console.log(sumOrMinus(2, 5, 8, 4));    // 19
        console.log(sumOrMinus(8, 1, 2));       // -7
    </script>

</body>
</html>
